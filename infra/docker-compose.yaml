services:
  app:
    build: ../test-app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://commons:commons@postgres:5432/commons
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kafka

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commons
      POSTGRES_USER: commons
      POSTGRES_PASSWORD: commons
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "commons", "-d", "commons"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - kafka

  kafka:
    image: apache/kafka:4.2.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: HOST://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kafka-data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 30s
      start_period: 30s
      start_interval: 3s
      timeout: 10s
      retries: 5
    tmpfs:
      - /tmp/kafka-data:mode=1777
    networks:
      - kafka

networks:
  kafka:
    driver: bridge
